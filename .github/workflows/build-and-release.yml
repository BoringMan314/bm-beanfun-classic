name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release Name (leave empty to use v5.9.2.2)"
        required: false
        default: ""
      release_type:
        description: "Release type"
        required: true
        default: "prerelease"
        type: choice
        options:
          - prerelease
          - release

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APP_VERSION: 5.9.2.2
  RELEASE_TAG: v5.9.2.2

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish Application
        run: dotnet publish Beanfun/Beanfun.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Prepare Release Notes
        id: prep_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ env.RELEASE_TAG }}"

          $exists = $false
          if (git ls-remote --tags origin | Select-String "refs/tags/$tag$") { $exists = $true }
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          if ($exists) {
              Write-Host "Tag $tag already exists. Skipping release creation."
              exit 0
          }

          $lastRelease = gh api repos/${{ github.repository }}/releases --paginate 2>$null | ConvertFrom-Json | Sort-Object created_at -Descending | Select-Object -First 1
          $range = if ($lastRelease) { "$($lastRelease.tag_name)..HEAD" } else { "-n 30" }
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}"

          $commits = git log $range --pretty=format:"- [%h]($repoUrl/commit/%H) %s - %an (%ad)" --date=short --no-merges
          $commitCount = if ($commits) { ($commits -split "`n").Count } else { 0 }
          $commitsText = if ($commits) { $commits -join "`n" } else { "No commits found" }

          $utcNow = (Get-Date).ToUniversalTime()
          $buildDateTime = $utcNow.ToString("yyyy-MM-dd HH:mm:ss")

          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          "commits_text<<$delimiter" >> $env:GITHUB_OUTPUT
          $commitsText >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT
          "commit_count=$commitCount" >> $env:GITHUB_OUTPUT
          "build_datetime=$buildDateTime" >> $env:GITHUB_OUTPUT

      - name: Create Release
        if: steps.prep_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || env.RELEASE_TAG }}
          body: |
            **Version:** ${{ env.APP_VERSION }}
            **Release Type:** ${{ github.event.inputs.release_type == 'release' && 'Release' || 'Pre-Release' }}
            **Build Time:** ${{ steps.prep_release.outputs.build_datetime }} (UTC)

            ---

            ### Download
            **[BeanfunClassic.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/BeanfunClassic.exe)**

            ### What's New
            ${{ steps.prep_release.outputs.commits_text }}

            Total commits: ${{ steps.prep_release.outputs.commit_count }}

            ### Installation
            1. Download **BeanfunClassic.exe** above.
            2. Replace your old file and run.

            ${{ github.event.inputs.release_type == 'prerelease' && '> **NOTE:** This is a pre-release version. Use at your own risk.' || '' }}

            <details>
            <summary>Technical Details</summary>

            | Item | Value |
            |------|-------|
            | Full Build Version | ${{ env.APP_VERSION }} |
            | Source Commit | [View](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |

            </details>
          files: publish/BeanfunClassic.exe
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
